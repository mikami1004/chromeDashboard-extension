<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>新しいタブ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="overlay"></div>

  <div id="weather-container">
    <span id="weather-icon">--</span>
    <span id="weather-temp">--℃</span>
    <div id="weather-location">位置情報取得中...</div>
  </div>

  <main class="container">
    <h1 id="clock">00:00</h1>
    <h2 id="greeting">Hello!</h2>

    <div class="todo-container">
      <input type="text" id="todo-input" placeholder="What is your today's task?">
      <ul id="todo-list"></ul>
    </div>
  </main>

  <div id="shortcuts-container">
    <div id="shortcuts-list">
      <button id="add-shortcut-btn" title="ショートカットを追加">
        <div class="shortcut-icon-wrapper add-icon-wrapper">
          <span class="add-plus-symbol">+</span>
        </div>
        <span class="shortcut-title">追加</span>
      </button>
    </div>
  </div>

  <div id="shortcut-modal" class="modal">
    <div class="modal-content">
      <h3>ショートカットの追加</h3>
      <input type="text" id="shortcut-name-input" placeholder="名前(例: GitHub)">
      <input type="url" id="shortcut-url-input" placeholder="URL">
      <div class="modal-buttons">
        <button id="modal-cancel-btn">キャンセル</button>
        <button id="modal-save-btn">保存</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
